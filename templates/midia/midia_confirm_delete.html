{% extends 'base.html' %}
{% block title %}Excluir Mídia - Avante{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center">
  <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-4"></i>
    <h1 class="text-xl font-bold text-gray-900 mb-2">Excluir Mídia</h1>
    <p class="text-gray-500 mb-6">Tem certeza que deseja excluir "{{ object.titulo }}"?</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex items-center justify-center gap-3">
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-lg font-medium transition">
          <i class="fas fa-trash mr-2"></i> Excluir
        </button>
        <a href="{% url 'midia:list' %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2.5 rounded-lg font-medium transition">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
