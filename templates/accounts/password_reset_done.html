{% extends 'base.html' %}
{% block title %}E-mail Enviado - Avante{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto text-center">
  <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <i class="fas fa-envelope text-green-600 text-5xl mb-4"></i>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">E-mail Enviado!</h1>
    <p class="text-gray-500">Verifique sua caixa de entrada e siga as instruções para recuperar sua senha.</p>
    <p class="text-gray-400 text-sm mt-2">Se não encontrar o e-mail, verifique a pasta de spam.</p>
    <a href="{% url 'accounts:login' %}" class="inline-block mt-6 bg-green-700 text-white px-6 py-2.5 rounded-lg hover:bg-green-600 font-medium transition">Voltar ao Login</a>
  </div>
</div>
{% endblock %}
