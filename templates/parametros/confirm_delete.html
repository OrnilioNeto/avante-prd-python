{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-12 text-center">
  <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <i class="fas fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
    <h2 class="text-xl font-bold text-gray-900 mb-2">Confirmar Exclusao</h2>
    <p class="text-gray-600 mb-6">Tem certeza que deseja excluir <strong>{{ object }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex items-center justify-center gap-3">
        <button type="submit" class="bg-red-600 text-white px-6 py-2.5 rounded-lg hover:bg-red-500 font-medium transition"><i class="fas fa-trash"></i> Excluir</button>
        <a href="{% if cancel_url %}{{ cancel_url }}{% else %}{% url 'parametros:list' %}{% endif %}" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded-lg hover:bg-gray-200 font-medium transition"><i class="fas fa-times"></i> Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
