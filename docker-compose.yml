services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: avante
      MYSQL_USER: avante
      MYSQL_PASSWORD: avante
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=avante
      - DB_USER=avante
      - DB_PASSWORD=avante
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate 2>/dev/null || python manage.py migrate admin --fake 2>/dev/null; python manage.py migrate 2>/dev/null; python manage.py runserver 0.0.0.0:8000"

volumes:
  mysql_data: